openapi: 3.0.3
info:
  title: Zheungyuan Rental CRM
  version: 1.0.0
  description: >
    Private internal API for reviewing imported WhatsApp renter prospects and
    saving structured renter requirements. It cannot send WhatsApp messages.
servers:
  - url: https://whatsapp-reader-production-e4bf.up.railway.app
paths:
  /gpt/health:
    get:
      operationId: checkZheungyuanCRM
      summary: Check that the private Zheungyuan CRM bridge is available.
      responses:
        "200":
          description: Bridge is available.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /gpt/prospects:
    get:
      operationId: listRenterProspects
      summary: List imported prospective renter leads.
      description: >
        Use analysis=unreviewed to find leads that have not yet been analysed
        by the Custom GPT. Use analysis=all when reviewing existing structured
        demand.
      parameters:
        - in: query
          name: analysis
          schema:
            type: string
            enum: [unreviewed, analysed, all]
            default: unreviewed
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [active, historical, closed, unknown, not_prospect]
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Prospect list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
                  analysis:
                    type: string
                  prospects:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /gpt/prospects/{id}/conversation:
    get:
      operationId: getRenterProspectConversation
      summary: Read the stored WhatsApp conversation for one prospect.
      description: >
        Returns the prospect profile plus stored messages in chronological
        order. Use this before analysing or updating a prospect.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 20
            maximum: 500
            default: 250
      responses:
        "200":
          description: Prospect and conversation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Prospect not found.

  /gpt/prospects/{id}/analysis:
    post:
      operationId: saveRenterProspectAnalysis
      summary: Save structured renter requirements extracted from a conversation.
      description: >
        Only call this after reading the prospect conversation. Unknown facts
        must be sent as null rather than guessed.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - requirement_summary
                - analysis_confidence
              properties:
                area_wanted:
                  type: string
                  nullable: true
                  description: Concise area or areas explicitly requested.
                budget_min:
                  type: integer
                  nullable: true
                  description: Monthly HKD minimum, only when supported by the conversation.
                budget_max:
                  type: integer
                  nullable: true
                  description: Monthly HKD maximum or stated ceiling.
                bedrooms:
                  type: integer
                  nullable: true
                preferred_floor:
                  type: string
                  nullable: true
                  description: e.g. GF, 1/F, 2/F, top floor, any.
                wants_garden:
                  type: boolean
                  nullable: true
                wants_rooftop:
                  type: boolean
                  nullable: true
                pets_required:
                  type: boolean
                  nullable: true
                pet_details:
                  type: string
                  nullable: true
                parking_needed:
                  type: boolean
                  nullable: true
                move_in_date:
                  type: string
                  format: date
                  nullable: true
                occupants:
                  type: string
                  nullable: true
                source_property:
                  type: string
                  nullable: true
                  description: Property or listing originally enquired about, if identifiable.
                requirement_summary:
                  type: string
                  description: 1 to 3 sentence evidence-based renter requirement summary.
                status:
                  type: string
                  enum: [active, historical, closed, unknown, not_prospect]
                analysis_confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                analysis_notes:
                  type: string
                  nullable: true
                  description: Important ambiguity, contradictions, or classification notes.
      responses:
        "200":
          description: Updated prospect.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid structured analysis.
        "404":
          description: Prospect not found.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
